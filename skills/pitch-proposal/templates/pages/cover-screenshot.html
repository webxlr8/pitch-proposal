<!-- PAGE: cover-screenshot · Cover showing the client's CURRENT site in a browser frame (refresh / fix proposals).
     Images: images/current-site.jpg (1440x900 screenshot of their homepage, from screenshots.py) -->
<section class="page cover">
  <div class="grid"></div><div class="glow tr"></div><div class="glow bl"></div>
  <img class="logo" src="{{LOGO}}" alt="{{COMPANY}}">
  <div class="ref">{{DOC_TYPE}}<br>{{DATE}}</div>
  <div class="ct" style="top:52mm">
    <div class="eyebrow">Website refresh proposal</div>
    <h1>A cleaner, faster home for <em>{{CLIENT}}.</em></h1>
    <p class="sub">We rebuild {{CLIENT_DOMAIN}} page for page, fix every layout problem and give the whole site a clean, modern look.</p>
  </div>
  <div class="dev" style="top:118mm">
    <div class="win" style="height:118mm"><div class="bar"><i></i><i></i><i></i><div class="u">{{CLIENT_DOMAIN}}</div></div><img src="images/current-site.jpg" alt="" style="height:112mm;object-fit:cover;object-position:top"></div>
    <div style="position:absolute;left:0;right:0;bottom:-1px;height:46mm;background:linear-gradient(transparent,var(--bg))"></div>
  </div>
  <div class="meta">
    <div><div class="k" style="margin-bottom:1.4mm">Prepared for</div><b>{{CLIENT}}</b></div>
    <div class="r"><div class="k" style="margin-bottom:1.4mm">Prepared by</div><b>{{COMPANY}}</b><br>{{WEBSITE}}</div>
  </div>
</section>
